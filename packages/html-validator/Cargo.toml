[package]
name = "postplan-html-validator"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
rust-version = "1.98.1"
[lib]
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
html5ever = { version = "=0.40.1", path = "vendor/html5ever" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
