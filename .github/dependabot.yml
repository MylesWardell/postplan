version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      orpc:
        patterns:
          - "@orpc/*"
      oxc:
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/app
      - /infra/terraform/bootstrap
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(infra)
    groups:
      terraform:
        patterns:
          - "*"
