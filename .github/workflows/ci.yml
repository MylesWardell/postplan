name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run pack:cli
      - run: node apps/cli/bin/postplan.js --help
      - run: docker build --tag postplan:ci .
      - run: docker build --target lambda-app --tag postplan:lambda-app .
      - run: docker build --target lambda-cleanup --tag postplan:lambda-cleanup .
  dynamodb:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test --conditions=source ./test/api.test.ts ./test/ssr.test.ts ./test/dynamo.test.ts ./test/gateway.test.ts ./test/store.test.ts
        working-directory: apps/server
        env:
          POSTPLAN_TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
