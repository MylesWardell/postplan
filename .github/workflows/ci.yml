name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postplan
          POSTGRES_PASSWORD: postplan-test
          POSTGRES_DB: postplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postplan -d postplan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postplan:postplan-test@localhost:5432/postplan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:cli
      - run: node apps/cli/bin/postplan.js --help
      - run: docker build --tag postplan:ci .
